default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= Integer(ENV.fetch("RAILS_MAX_THREADS", 5)) %>

development:
  <<: *default
  url: <%= ENV.fetch("DEVELOPMENT_DATABASE_URL", "postgresql:///webhook_delivery_development").inspect %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql:///webhook_delivery_test").inspect %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql:///webhook_delivery_production").inspect %>
